<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="scss/main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">

                    </li>
                    <li class="tipo secundaria">
                        <span class="texto-oculto">Misiones Secundarias</span>
                        <img class="icon" src="/assets/icons/secundaria.png" alt="Simbolo sheika">
                    </li>
                    <li class="tipo opcional">
                        <span class="texto-oculto">Misiones Heroicas</span>
                        <img class="icon" src="/assets/icons/opcional.png" alt="">

                </ul>
            </div>

            <div class="tareas">

            </div>
        </section>

        <section class="tarea"></section>

    <script src="JS/app.js" type="module"></script>
